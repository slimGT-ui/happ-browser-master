<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0a10">
  <title>HAPP Browser</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <main class="popup">
    <header class="header">
      <div class="brand-mark" aria-hidden="true">H</div>
      <div class="brand-copy">
        <h1>HAPP <span>Browser</span></h1>
        <p>Управление подключением из браузера</p>
      </div>
    </header>

    <section class="welcome" aria-labelledby="welcome-title">
      <div class="eyebrow"><span class="status-dot"></span> ОСНОВА РАСШИРЕНИЯ</div>
      <h2 id="welcome-title">Всё начинается здесь.</h2>
      <p>Интерфейс HAPP Browser готов. Подключение к HAPP Desktop появится на следующих этапах разработки.</p>
    </section>

    <footer class="footer">
      <span class="footer-indicator" aria-hidden="true"></span>
      <span id="runtime-status" role="status">Расширение загружено</span>
      <span class="version">v0.1.0</span>
    </footer>
  </main>
</body>
</html>
