name: HAPP Browser stable package

on:
  push:
    branches:
      - release/1.0.0-stable
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate source
        run: npm run validate
      - name: Build Firefox extension package
        run: |
          zip -j happ-browser-1.0.0.zip \
            manifest.json popup.html popup.css popup.js advanced.js \
            ip-validation.js ip-classification.js timeline.js
          unzip -l happ-browser-1.0.0.zip
      - name: Upload stable package
        uses: actions/upload-artifact@v4
        with:
          name: happ-browser-1.0.0
          path: happ-browser-1.0.0.zip
          if-no-files-found: error
          retention-days: 90
